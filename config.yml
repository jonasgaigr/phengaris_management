#----------------------------------------------------------#
#
#       Phengaris spp. management in Czechia
#
#                  Configuration
#
#----------------------------------------------------------#
#
# Every tunable choice of the analysis is set here and nowhere else.
# R/functions/config.R reads this file into the list CONFIG when
# R/00_setup.R runs, and checks that nothing required is missing.
#
# Choices that need a decision on the ecology or on the field protocol are
# marked TODO(Jonáš). Until that decision is made, the value given is the one
# that reproduces the original analysis.
#
#----------------------------------------------------------#

#--------------------------------------------------#
# Years and species -----
#--------------------------------------------------#

# Monitoring years analysed, inclusive.
years:
  first: 2019
  last: 2024

species:
  nausithous:
    name: Phengaris nausithous
    # The Natura 2000 site-subject table still uses the former genus name.
    n2k_name: Maculinea nausithous
  teleius:
    name: Phengaris teleius
    n2k_name: Maculinea teleius

#--------------------------------------------------#
# Coordinate reference system -----
#--------------------------------------------------#

crs:
  # S-JTSK / Krovak East North, the national CRS every layer is aligned to.
  epsg: 5514
  # Bounding box of Czechia in S-JTSK (the border's, -904585 / -431724 and
  # -1227296 / -935244, widened by about 1 km). Coordinates outside it are
  # rejected by the validation at the end of the data steps.
  bbox:
    xmin: -906000
    xmax: -430000
    ymin: -1229000
    ymax: -934000

#--------------------------------------------------#
# Specifications -----
#--------------------------------------------------#

# The cascade runs once per specification listed under `run`: the steps that
# depend on the analytical choices write to Data/Processed/<name> and
# Outputs/<name>, the steps that do not run once, into Data/Processed/common
# and Outputs/common. Outputs/REPORT.md collects all of them.
specifications:
  run:
    - legacy
    - revised
  definitions:
    legacy:
      description: >-
        The original analysis choices: the original model set, data subsets
        and derived variables, with the bug fixes listed in CHANGELOG.md
        applied.
      # How absences are imputed (R/functions/imputation.R): "legacy_cell"
      # (the original rule: by 10 km range cell, across all years), "visit"
      # (by site and date) or "none". Every rule imputes only inside the
      # imputed species' own reporting range.
      imputation_rule: legacy_cell
      # Keep the targeted records that lie outside their species' own
      # reporting range (all explicit negatives); the original dropped them.
      keep_outside_range: false
      # Which records the host-plant filter of step 04 drops:
      # "absent_or_unknown" (the original: host plant recorded absent, or no
      # host-plant information), "absent" (only host plant recorded absent)
      # or "none".
      host_plant_filter: absent_or_unknown
      # How the threat list is turned into threat classes: "legacy" (the
      # phrases of strukt_pozn: threat_classes, matched anywhere in the list)
      # or "harmonised" (the items of both field-form lists matched one by
      # one, strukt_pozn: threat_items).
      threat_vocabulary: legacy
      # Add the survey-design variables of the revised analysis in step 04
      # (observer, day of year, protocol era, persistent site, connectivity)
      # and keep one record per species x site x visit.
      design_variables: false
      # How a record is described by the habitat segments its site overlaps:
      # "legacy" (one segment, the least natural and smallest) or
      # "area_weighted" (summaries over all segments). See
      # R/functions/habitat_layers.R.
      habitat_segment_rule: legacy
      # Which habitat layers: "frozen" (the site x segment intersection of
      # the original analysis, Data/Input/habitats/legacy) or "current" (the
      # current VMB layer and KVES 2025, intersected by step 05 with the
      # current site geometries). "current" falls back to "frozen" when step
      # 05 had no current VMB layer.
      habitat_source: frozen
      # The models fitted after step 06: "legacy" runs steps 09-13 with the
      # model set of R/functions/model_specs_legacy.R; "revised" runs steps
      # 17-20 (R/functions/model_specs_revised.R).
      model_set: legacy
    revised:
      description: >-
        The revised analysis approved in the Phase 3 review (REVIEW.md,
        P3.1-P3.9): one record per species x site x visit; absences imputed
        visit by visit and only inside the imputed species' reporting range;
        explicit negatives outside the range kept; only records with a
        host-plant entry in their structured notes; observer, day of year and
        protocol era as detection covariates; multivariable glmmTMB models
        with diagnostics, fitted with and without the imputed absences;
        connectivity, spatial autocorrelation, per-threat models and an
        abundance supplement.
      imputation_rule: visit
      keep_outside_range: true
      # A site without Sanguisorba cannot hold the species (276 P. nausithous
      # records with the host plant recorded absent hold 4 positives, 66
      # P. teleius records none), so these structural zeros are dropped.
      # Records without a host-plant entry are dropped too: the analysis uses
      # only the records whose structured notes (STRUKT_POZN) were filled in,
      # and the host plant is the entry a filled-in form has. Of the 649 such
      # records, 511 have no structured notes at all, 397 of them the whole
      # source "Kolektiv autorů (2021) Monitoring totenových modrásků".
      # Decided 2026-11-12; until then only the records with the host plant
      # recorded absent were dropped ("absent").
      host_plant_filter: absent_or_unknown
      threat_vocabulary: harmonised
      design_variables: true
      habitat_segment_rule: area_weighted
      habitat_source: current
      model_set: revised

#--------------------------------------------------#
# Data sources counted as targeted monitoring -----
#--------------------------------------------------#

# Only records from these campaigns enter the analysis. Everything else is
# opportunistic recording, for which absences cannot be inferred.
#
# The source year is the year the dataset was published, not the year of the
# record: "Kolektiv autorů (2022) Monitoring motýlů." holds the records of
# 2022, 2023 and 2024 (and 5 from 2021), and the 2021 sources hold 28 records
# from 2019 and 2020. TODO(Jonáš): confirm that this is intended.
sources:
  targeted:
    - Kolektiv autorů (2019) Monitoring totenových modrásků. Monitoring druhů ČR. AOPK ČR.
    - Kolektiv autorů (2020) Monitoring totenových modrásků. Monitoring druhů ČR. AOPK ČR.
    - Kolektiv autorů (2021) Monitoring totenových modrásků. Monitoring druhů ČR. AOPK ČR.
    - Kolektiv autorů (2020) Monitoring motýlů. Monitoring druhů ČR. AOPK ČR.
    - Kolektiv autorů (2021) Monitoring motýlů. Monitoring druhů ČR. AOPK ČR.
    - Kolektiv autorů (2022) Monitoring motýlů.
    # The next two match no record in the 2019-2024 exports today. They are
    # kept so that a later export using them is picked up.
    - Kolektiv autorů (2023) Monitoring motýlů.
    - Kolektiv autorů (2024) Monitoring motýlů.
  # TODO(Jonáš): are any of these targeted monitoring too? They are not used
  # unless moved into the list above. Record counts in the 2019-2024 exports
  # in brackets.
  candidates:
    - Kolektiv autorů (2024) Síťové mapování denních motýlů v letech 2024-2029.  # 156
    - FIŠER M. (2020) Monitoring EV druhů.                                       # 129
    - FIŠER M. (2021) Monitoring EV druhů.                                       # 65
    - FIŠER M. (2023) Mapováni EV druhů (2023).                                  # 52

#--------------------------------------------------#
# Records excluded -----
#--------------------------------------------------#

# Records the validation of the source database marks as unusable
# (VALIDACE "záznam k opravě", with the note in VAL_POZN). Step 01 drops them
# when it reads the exports, so no later step sees them: not the analysis
# table, and not the positive records of every source that give the flight
# season, the connectivity and the plausibility of an imputed absence.
# Decided 2026-11-12. The two other records marked "záznam k opravě" are not
# targeted monitoring and are kept: their notes correct the observer and the
# date, not the observation.
records:
  excluded:
    # P. teleius, 7 July 2019, iNaturalist. It was the only positive record of
    # the species within 6.5 km, and made two imputed absences plausible.
    - id: 48780342
      reason: "špatná lokalizace, na místě není vhodný biotop ani živná rostlina"
    # P. nausithous, 23 July 2021, targeted monitoring.
    - id: 52600070
      reason: "zákres neodpovídá popisu"

#--------------------------------------------------#
# Imputed absences -----
#--------------------------------------------------#

imputation:
  # An imputed absence is a copy of a record of the other species. These
  # columns describe that other species' observation (its count, how it was
  # counted, its behaviour, its taxon note), so they are emptied on the copy.
  # CESKE_JMENO is set to the Czech name of the imputed species instead. The
  # site-level fields (site, date, observer, habitat, management, threats,
  # host plant) are kept.
  species_specific_columns: [POCET, ODHAD, POCITANO, REL_POC, ETOLOGIE, TAX_POZN]
  # A record of the other species shows effort, not absence (Phillips et al.
  # 2009). An imputed absence is plausible (P4.3) when the visit falls in the
  # imputed species' flight season (which every revised model requires, P4.1)
  # and a positive record of that species, from any source in 2012-2024,
  # lies within this distance (km) of the site: the longest recorded move of
  # P. teleius is 2.94 km (Nowicki et al. 2014). The revised models are
  # fitted on a third sample with only the plausible imputed absences.
  # PROPOSED.
  plausible_radius_km: 3

#--------------------------------------------------#
# Habitat description (POP_BIOT) -----
#--------------------------------------------------#

# POP_BIOT is a comma-separated list of the habitat categories of the field
# form, sometimes with free text. Each flag is 1 when any of its phrases
# occurs, 0 when none does, and NA when there is no description at all.
pop_biot:
  flags:
    TTP: ["TTP s pravidelným managementem"]            # managed grassland
    # "příkop" covers both form categories, "příkop" and "příkop u komunikace".
    PRIKOP: ["příkop"]                                 # ditch, road verge
    ZARUST: ["zarůstající louka bez managementu"]      # neglected grassland
    JINY: ["jiný"]                                     # "jiný", "jiný typ biotopu-..."
    # The last two categories of the form set no flag until 2026-11-12, so a
    # site described only as a water margin had no habitat type (HET_INN 0).
    VODA: ["okraj vodní plochy"]                       # margin of a water body
    PASTVINA: ["pastvina"]                             # pasture

#--------------------------------------------------#
# Structured notes (STRUKT_POZN) -----
#--------------------------------------------------#

# STRUKT_POZN is a string of "key: value" pairs written by the field form;
# R/functions/strukt_pozn.R parses it. Each key of the form is mapped to the
# column it is parsed into. The form changed over the years, so two keys can
# feed one column. Every key below occurs in the 2019-2024 exports (counts of
# targeted records in brackets).
strukt_pozn:
  keys:
    "Seč vhodně načasovaná": mow_timing            # 2502; ano / ne
    "Seč celoplošná": mow_whole_area               # 2409; ano / ne
    "Pastva": grazing                              # 120, 2021 onwards; extenzivní / intenzivní / ne
    "Negativní vlivy na lokalitě": threats         # 2935, 2019-2023; the older threat list
    "vliv": threats                                # 894, 2021 onwards; the newer threat list
    "jiný vliv": other_threat                      # 44; free text
    "Perspektiva lokality": prospects              # 4100; dobrá / špatná / neznámá
    "Přítomnost rostlin": host_plant               # 2410, 2020 onwards
    "sta_pritomnostrostlin": host_plant            # 1876, 2019-2020
    "Poměr pohlaví": sex_ratio                     # 605; free text, e.g. 7:3
    "Procento mikrolokalit s vyhovujícím stavem živných rostlin": host_plant_share  # 1

  # The first year whose field form has a grazing entry (`Pastva`). Before
  # it grazing was not recorded at all, so GRAZE is NA. From it on a
  # filled-in record without a `Pastva` entry is read as not grazed: the form
  # writes the entry for a grazed site only ("Pastva: ne" occurs twice among
  # 151 entries). A record whose structured notes are empty says nothing, so
  # GRAZE is NA there. The mowing entries are read the same way: MOW is 1
  # with a mowing entry, 0 on a filled-in form without one, NA where the
  # notes are empty. Decided 2026-11-12.
  grazing_recorded_from_year: 2021

  # Host plant (Sanguisorba officinalis) abundance classes, in order.
  host_plant_levels:
    "žádné": 0
    "jednotlivě": 1
    "hojně": 2
    "dominantně": 3

  # Threat classes. A record has a class when its threat list contains any
  # of the class's phrases. These are the phrases of the original analysis.
  # They cover the newer threat list but not much of the older one: e.g.
  # "sečení" (857 records), "vývoj biocenózy" (540), "eutrofizace" (335),
  # "pastva" (101) and "hnojení" (68) match no class (REVIEW.md, item 18).
  # TODO(Jonáš): map the items of the older list to these classes.
  # The phrase with which the surveyor records that no threat was seen. It
  # sets the flag None and is not a threat, so it is not counted in
  # SUM_THREATS.
  no_threat_phrase: "žádný vliv"
  # Used by the legacy threat vocabulary (specifications: threat_vocabulary).
  threat_classes:
    LandUseChange: ["změna zemědělského využívání půdy a terénní úpravy"]
    Abandonment: ["absence či nedostatek péče"]
    HarmfulMow: ["nevhodná seč"]
    HarmfulGrazing: ["nevhodná pastva"]
    GrazingByeffects: ["dopady chovu dobytka mimo pastvu"]
    FertilizerUse: ["aplikace hnojiv"]
    Afforestation: ["zalesňování bezlesí"]
    Invasives: ["invazní druhy"]
    NativeDominants: ["expanzní druhy"]
    AbioticNaturalProcesses: ["abiotické přírodní procesy"]
    Encroachment: ["sukcese"]
    BiomassAccumulation: ["hromadění organického materiálu"]
    Eutrophization: ["eutrofizace či okyselování"]

  # The harmonised threat vocabulary (specifications: threat_vocabulary:
  # harmonised). The field form had two threat lists:
  #
  #   2019-2020  an older list (key `Negativní vlivy na lokalitě`), with no
  #              "no threat" item;
  #   2021-2024  the current list (key `Negativní vlivy na lokalitě` until
  #              2023, `vliv` from 2021), the one the classes are named after.
  #
  # Each item of either list is matched as a whole item (so "eutrofizace"
  # does not match inside "dopady chovu dobytka mimo pastvu (např. sešlap,
  # eutrofizace apod.)", and "sukcese" does not match "sukcese všeobecně").
  # An item may carry a free-text comment after ":", which is ignored. The
  # older items are mapped to the class of their nearest current item; the
  # ones without an equivalent in the current list are listed under
  # `unmapped` and set no class. Three current classes have no item on the
  # older list (abandonment, effects of livestock farming, native
  # dominants); in 2019-2020 they are unknown, not absent
  # (`threat_min_records_per_era`).
  # Counts are item occurrences in the targeted records of 2019-2024.
  # PROPOSED in Phase 3 (P3.7). TODO(Jonáš): check the mapping of the older
  # items (marked "older list").
  threat_items:
    LandUseChange:
      - "změna zemědělského využívání půdy a terénní úpravy"
      - "terénní úpravy"                                             # older list, 18
      - "dosev a obnova trvalých travních porostů"                   # older list, 9
      - "odstraňování mezí, křovišť a drobných lesíků"               # older list, 9
    Abandonment:
      - "absence či nedostatek péče"
    HarmfulMow:
      - "nevhodná seč (vysoká intenzita, termín apod.)"
      - "sečení"                                                     # older list, 769; mowing listed as a negative influence
    HarmfulGrazing:
      - "nevhodná pastva (vysoká intenzita, termín apod.)"
      - "pastva"                                                     # older list, 98; grazing listed as a negative influence
    GrazingByeffects:
      - "dopady chovu dobytka mimo pastvu (např. sešlap, eutrofizace apod.)"
    FertilizerUse:
      - "aplikace hnojiv"
      - "hnojení"                                                    # older list, 64
    Afforestation:
      - "zalesňování bezlesí"
      - "vysazování lesů"                                            # older list, 10
    Invasives:
      - "invazní druhy"
      - "invaze nějakého druhu (neofyty)"                            # older list, 36
    NativeDominants:
      - "expanzní druhy (mimo invazních)"
    AbioticNaturalProcesses:
      - "abiotické přírodní procesy (eroze, zanášení, vysychání apod.)"
      - "vysychání (mokřadního ekosystému)"                          # older list, 91
    Encroachment:
      - "sukcese"
      - "sukcese všeobecně"                                          # older list, 512
      - "vývoj biocenózy"                                            # older list, 512; always listed with "sukcese všeobecně"
    BiomassAccumulation:
      - "hromadění organického materiálu"
      - "hromadění organického materiálu (stařiny)"                  # older list, 394
    Eutrophization:
      - "eutrofizace či okyselování"
      - "eutrofizace"                                                # older list, 284
  # Older-list items with no equivalent in the current list. They are
  # reported, not modelled.
  threat_items_unmapped:
    - "meliorace"                                                    # 32
    - "odvodňování"                                                  # 32
    - "zaplavování"                                                  # 27
    - "změna hydrologických poměrů v důsledku zemědělství"           # 11
    - "zpevňování stok, kanálů, hrází rybníků, nádrží, mokřadů"      # 13
    - "nadměrné využívání"                                           # 29
    - "sešlapávání"                                                  # 29
    - "absence nebo narušení mezidruhových vztahů (např. opylovači, živné rostliny apod.)"  # 31
    - "používání pesticidů"                                          # 1
  # A threat class recorded at fewer than this many records of a field-form
  # era (over both species) was not on that era's threat list: it is NA
  # there rather than 0 (R/functions/threats.R, mask_unlisted_threats()).
  threat_min_records_per_era: 5
  # Threat classes unknown in single years, beside the eras above
  # (R/functions/threats.R, mask_threat_years()): NA in that year, not 0 and
  # not 1. The threat lists of 2021 differ from those of 2022-2024 in two
  # items. "absence či nedostatek péče" is listed at 1 of the 627 records
  # with a threat list in 2021, against 192 of 645 in 2022 (23-29 % in
  # 2022-2024): it was evidently not on the form yet. "nevhodná pastva" is
  # listed at 212 of them (34 %), against 5 in 2022 (1-3 % in 2022-2024),
  # with grazing recorded at only 9 of the 212 and most of them on mown
  # meadows: whatever the surveyors ticked there, it is not the grazing of
  # the later years. Decided 2026-11-12.
  threat_unknown_years:
    Abandonment: [2021]
    HarmfulGrazing: [2021]
  # The Article 17 pressure code of each threat class (reference list of
  # threats, pressures and activities of the 2013-2018 reporting), so that
  # both field-form lists, and other studies, speak the same language
  # (P4.11). The current Czech threat list follows that list closely.
  # PROPOSED. TODO(Jonáš): check against the reference list.
  threat_article17:
    LandUseChange: "A02"              # conversion from one agricultural land use to another
    Abandonment: "A06"                # abandonment of grassland management
    HarmfulMow: "A08"                 # mowing or cutting of grasslands
    HarmfulGrazing: "A09"             # intensive grazing or overgrazing by livestock
    GrazingByeffects: "A14"           # livestock farming (without grazing)
    FertilizerUse: "A19, A20"         # natural and synthetic fertilisers
    Afforestation: "B01"              # conversion to forest, afforestation
    Invasives: "I01, I02"             # invasive alien species
    NativeDominants: "I04"            # problematic native species
    AbioticNaturalProcesses: "L01"    # abiotic natural processes (erosion, silting, drying out)
    Encroachment: "L02"               # natural succession
    BiomassAccumulation: "L03"        # accumulation of organic material
    Eutrophization: "L04"             # natural eutrophication or acidification

#--------------------------------------------------#
# Persistent sites -----
#--------------------------------------------------#

sites:
  # Site geometries of different years closer than this (metres) are merged
  # into one persistent site, SITE_ID, by match_sites() (R/functions/sites.R);
  # 0 merges only geometries that touch. The revised models use it for the
  # optional site random effect and to keep a site out of its own
  # connectivity. 50 m as proposed in REVIEW.md and approved (P3.1).
  match_distance_m: 50
  # The site random effect is refitted with the persistent sites built at
  # these distances too, as a sensitivity check (P3.1).
  sensitivity_distances_m: [0, 200]

#--------------------------------------------------#
# Survey design of the revised analysis -----
#--------------------------------------------------#

# Used by the specifications with design_variables: true
# (R/functions/design_variables.R).
design:
  # The field form changed in 2021: polygons instead of points, a grazing
  # entry, a new host-plant key and a new threat list (REVIEW.md, item 20).
  # PROTOCOL_ERA is "2019-2020" before this year and "2021-2024" from it.
  protocol_change_year: 2021

  # Detection depends on where in the flight season a visit falls. Each
  # visit is placed relative to the season of its own species and year:
  # DOY_DEV = day of year - median day of year of the positive records of
  # that species in that year (decided in the review, P3.3).
  flight_window:
    # Which positive records give the median: "all" (every source, the
    # opportunistic records included) or "targeted" (the monitoring
    # campaigns only). Only records with an exact date (DATUM_OD = DATUM_DO)
    # count. "all" gives 184-1231 records per species and year, against 10-420
    # targeted ones; the medians differ by at most 7 days.
    reference_sources: all
    # Which visits fall inside the flight season (IN_FLIGHT_WINDOW): outside
    # it the species cannot be detected, so a visit there says nothing about
    # occupancy. Such visits stay in the data and are left out of the revised
    # models.
    #
    #   flight_curve  where the species' flight curve (below) is at least
    #                 `min_relative_activity` of its peak (P4.1)
    #   fixed         within `max_abs_deviation_days` of the median (Phase 3)
    #
    # The literature review (P4.1) found the 45 days of Phase 3 about twice
    # the documented flight period of 6-8 weeks and proposed the cut-off
    # where the flight curve falls below 5 % of its peak. PROPOSED.
    cutoff: flight_curve
    min_relative_activity: 0.05
    # The flight curve is fitted on the visits within this many days of the
    # median, and evaluated only there; a visit farther away is outside the
    # season under either rule. Positive targeted records lie at most 40 days
    # from their median; the three visits of October and December 2024 lie
    # 99-143 days from it (REVIEW.md, item 25).
    max_abs_deviation_days: 45
    # The management models are refitted on the visits within these many
    # days of the median too: 28 days is the 8-week flight period of the
    # literature centred on the median, 45 the window of Phase 3 (P4.1).
    sensitivity_days: [28, 45]

  # The flight curve (P4.1): the expected count of adults at a visit across
  # the season, pooled over the sites, as the butterfly monitoring schemes
  # estimate it (Dennis et al. 2013; Schmucki et al. 2016). For each species,
  # a negative-binomial GAM of the count at the targeted visits (0 at a
  # negative visit) against DOY_DEV, with random intercepts for the year and
  # the mapping grid square (R/functions/flight_curve.R, step 16). The
  # relative activity of a visit is the expected count divided by the peak of
  # the curve.
  flight_curve:
    # Basis dimension of the smooth of DOY_DEV. Small, because the visits
    # cover the early part of the season thinly (P. teleius: 12 visits more
    # than 10 days before the median).
    k: 5
    # The season may run differently higher up. "when_better" lets the curve
    # change with the elevation (ti(DOY_DEV, ELEVATION)) when that lowers the
    # AIC; "always" or "never" force the choice. Without the elevation layer
    # (Data/Input/reference/elevation.tif) the curve has no elevation.
    elevation: when_better
    # The curve is tabulated every this many metres of elevation; a record
    # takes the nearest.
    elevation_step_m: 25

  # The observer, from AUTOR, enters the revised models as a random effect
  # (P3.3). Names are normalised (case, diacritics, academic titles, word
  # order and the "jmeno.prijmeni" form; for several authors the first one
  # counts), which merges e.g. "Jiří Švarc", "Švarc Jiří" and "Jiří  Švarc".
  # The aliases merge the spellings the normalisation cannot, from the
  # normalised form to the normalised form. TODO(Jonáš): confirm.
  observer_aliases:
    "slavek valda": "slavomir valda"

#--------------------------------------------------#
# Connectivity -----
#--------------------------------------------------#

# Connectivity of a site to the populations around it (P3.5), the incidence
# function model index
#
#   S_i = sum_j exp(-alpha * d_ij) * A_j ^ b
#
# over the sites j occupied by the same species in the same or the previous
# year, other than the site itself (its persistent SITE_ID). d_ij is the
# distance between the sites' representative points in km, A_j the site
# area in ha. R/functions/connectivity.R; computed once, in step 16.
connectivity:
  # How alpha and b are chosen (P4.2). "profile": for each species, the pair
  # of the grids below under which the management model of the sample with
  # the imputed absences has the highest likelihood (profile likelihood,
  # step 17), as the literature review proposed; "fixed": the pair
  # alpha_per_km, area_exponent. PROPOSED.
  choice: profile
  # 1 / alpha is the mean dispersal distance, in km. The fixed pair is also
  # CONN in the data and the one the summary of step 16 describes. Phase 3
  # used alpha = 1 and b = 0.5; the review proposed b = 1, since the
  # immigration area exponent of the Czech mark-recapture studies is
  # 0.5-1.5 (P. nausithous) and 1.1-2.5 (P. teleius) (Nowicki & Vrabec
  # 2011).
  alpha_per_km: 1
  area_exponent: 1
  # The grids of the profile. alpha: the mean dispersal distances of the
  # Czech mark-recapture studies, 80-270 m (alpha 4-12), and of forested
  # landscapes, 0.5-1.5 km (alpha 0.7-2) (Nowicki & Vrabec 2011; Nowicki et
  # al. 2014), and flatter kernels for colonisation. b: 0 counts the
  # occupied sites alone, 0.5 keeps a few very large polygons (up to 985 ha)
  # from dominating, 1.5 lets them. The review proposed alpha 0.5-12 and b
  # 0.5-1.5; P. teleius had its best pair at the corner alpha 0.5, b 0.5, so
  # alpha 0.25 and b 0 and 0.25 were added to see whether the profile turns.
  alpha_grid_per_km: [0.25, 0.5, 1, 2, 3, 5, 8, 12]
  area_exponent_grid: [0, 0.25, 0.5, 1, 1.5]
  # Point and line sites have no area; they count with the median area of
  # the occupied polygon sites of the same species.
  # Which positive records count as occupied sites: "all" sources or
  # "targeted" only. An opportunistic record is as good evidence of a
  # population as a monitoring one.
  sources: all
  # Sources farther than this are ignored (exp(-alpha d) < 1e-10 at alpha =
  # 1, 2e-3 at alpha = 0.25). Phase 3: 15 km.
  max_distance_km: 25
  # The models take log10(S + offset): S spans orders of magnitude, and is 0
  # where no occupied site is within reach. 0.001 is about one 1 ha site
  # 7 km away.
  log_offset: 0.001

#--------------------------------------------------#
# Landscape -----
#--------------------------------------------------#

# The landscape around the sites at several scales (P4.7; step 21,
# R/functions/landscape.R), from the rasters R/tools/build_landscape_layers.R
# builds out of the KVES 2025 and VMB kraj archives in the cache.
landscape:
  dir: Data/Input/landscape
  resolution_m: 25
  coarse_resolution_m: 100
  # The KVES version the land cover comes from: the only one with codes for
  # every category.
  kves_version: "2025"
  # Land-cover groups, by the prefixes of the KVES codes: grassland (the
  # meadows and the degraded grassland), arable land, forest, water and
  # wetlands, settlements. The other classes (orchards, scattered and shrub
  # greenery, rocks) belong to no group. PROPOSED.
  groups:
    GRASSLAND: [B311, C11]
    ARABLE: [B111]
    FOREST: [D1]
    WATER: [E, F]
    URBAN: [A]
  # Radii (m) of the circles around each site: the eight radii of
  # Kajzer-Bonk et al. (2016) span 0.1-4 km, the review proposed 0.2-4 km.
  # Most variables fitted best at 4 km, the edge of that range, so 6 and
  # 8 km were added to see where the scale of effect lies. A circle of 8 km
  # around a site near the border lies partly outside Czechia; its shares
  # count only the part inside.
  radii_m: [200, 500, 1000, 2000, 3000, 4000, 6000, 8000]
  # Radii up to this are summarised on the 25 m rasters, larger ones on the
  # 100 m rasters.
  fine_max_radius_m: 500
  # A landscape variable, at its best radius, enters the combined habitat
  # model of step 22 when it improves the management model by more than this
  # much AIC.
  min_aic_gain: 2

#--------------------------------------------------#
# Natura 2000 -----
#--------------------------------------------------#

# The association with the EVLs designated for the species, after matching,
# and the persistence of the 2012-2018 populations (P4.8, P4.9; step 24,
# R/functions/natura2000.R). PROPOSED.
natura2000:
  # Full matching on the propensity score (MatchIt with optmatch).
  matching_method: full
  # Covariates designation cannot have changed: the site's natural and
  # Sanguisorba shares, its elevation, the grassland within 3 km (the scale
  # of grassland cover in Kajzer-Bonk et al. 2016), the connectivity at the
  # alpha and b of step 17, and the position. The connectivity reflects the
  # populations the designation was made for, which is why it is matched on.
  covariates: [NATURAL_SHARE, SANGUISORBA_SHARE, ELEVATION, GRASSLAND_3000, LOG_CONN, SITE_X, SITE_Y]
  # Matched exactly: the field-form era (points in 2019-2020, polygons
  # after).
  exact: [ERA]
  # The samples the matching and the persistence models are fitted on.
  samples: [with_imputed, plausible, observed]

#--------------------------------------------------#
# Management -----
#--------------------------------------------------#

# The objective check of the recorded mowing timing (P4.5, step 22).
management:
  # No cut should fall between these days (AOPK ČR: no second cut from early
  # July to early September). MM-DD.
  no_cut_window: ["07-01", "09-01"]
  # A note (POZNAMKA) saying the site was freshly mown at the visit (a Perl
  # regular expression, case-insensitive). It finds all 11 such notes of the
  # targeted records.
  fresh_mown_pattern: "čerstvě (po)?(se[čc]|kos)|pokoseno (ještě )?v den|v době (kontroly|návštěvy|monitoringu|průzkumu) (čerstvě )?(po)?(se[čc]|kos)|právě (po)?(se[čc]|kos)"

#--------------------------------------------------#
# Revised models -----
#--------------------------------------------------#

# Settings of the revised model set (R/functions/model_specs_revised.R,
# R/functions/model_revised.R), steps 17-20.
revised_models:
  # Random intercepts of every revised model (P3.1, P3.3): the mapping grid
  # square, the year and the observer.
  random_effects: [SITMAP, YEAR, OBSERVER]
  # How the position of the visit in the flight season enters every model:
  # "quadratic", DOY_DEV and its square (Phase 3); or "activity", the log of
  # the relative activity of the flight curve (LOG_ACTIVITY), as the
  # literature review proposed (P4.1). On the complementary log-log scale
  # the log activity would enter with a coefficient of 1, since the chance of
  # seeing at least one adult is 1 - exp(-expected count); on the logit scale
  # its coefficient is estimated. Step 17 compares the two: the quadratic
  # fits the P. nausithous records better (delta AIC 6), the activity the
  # P. teleius records about equally (1.8 in its favour), and the
  # management estimates hardly differ. The quadratic is kept; the flight
  # curve cuts the season and is the offset of the count models. PROPOSED.
  season_term: quadratic
  # The day-of-year deviation of the quadratic is in units of this many
  # days, so that its coefficients are of the order of the others.
  doy_unit_days: 10
  # Generalised VIF (GVIF^(1/(2 df))) above which a term is flagged.
  max_gvif: 2.2
  # A model whose fixed effects separate (detectseparation::detect_separation on the
  # model without random effects, or an estimate / SE above the thresholds of
  # `diagnostics`) is refitted with bias-reduced maximum likelihood
  # (brglm2) without random effects, and both fits are reported.
  bias_reduced_fallback: true
  # Spatial autocorrelation of the residuals (P3.6): DHARMa's Moran's I test
  # on the residuals aggregated per persistent site. When p is below `alpha`,
  # the grid random effect (1 | SITMAP) is compared with a smooth of the
  # coordinates, s(X, Y, k), fitted with mgcv; "always" fits the smooth
  # whatever the test says.
  autocorrelation:
    alpha: 0.05
    smooth_k: 60
    fit_smooth: when_autocorrelated
    # An SPDE spatial field (sdmTMB) in place of the grid random effect, on
    # the management models (P4.12): the minimum distance (km) between the
    # vertices of the mesh over the sites.
    spde_mesh_cutoff_km: 2
    # spatial+ (Dupont et al. 2022) on the management and protection terms:
    # the basis dimension of the smooth of the coordinates the covariates are
    # residualised on, and the shift (in standard errors of the original
    # estimate) above which an estimate is flagged as confounded with space.
    spatial_plus_k: 60
    spatial_plus_flag_se: 1
  # Per-threat models (P3.7): a class is modelled when at least this many
  # records with the threat are positive and at least this many are
  # negative; otherwise it is reported as too rare.
  threats:
    min_records_per_outcome: 5
    # The threats with a direction expected before looking, from the
    # management literature: harmful mowing, abandonment, harmful grazing,
    # fertiliser use and encroachment. Their p-values are adjusted with Holm,
    # the others' with Benjamini-Hochberg (P4.11). PROPOSED.
    confirmatory: [HarmfulMow, Abandonment, HarmfulGrazing, FertilizerUse, Encroachment]
    # The stacked model of all threat classes at once (P4.11).
    stacked: true

#--------------------------------------------------#
# Detection sensitivity -----
#--------------------------------------------------#

# The revised models are naive occupancy models (REVIEW.md, item 11). Step 23
# shows how far their management estimates could owe to imperfect detection
# (P4.4; R/functions/detection.R). No per-visit detection probability of
# adult Phengaris is published; the closest are daily mark-recapture capture
# probabilities of 0.4-0.5 (Nowicki & Vrabec 2011). PROPOSED.
detection:
  # The management model refitted with the detection fixed at each p.
  fixed_p: [0.9, 0.7, 0.5]
  # The Bayesian mixed-design occupancy model (spOccupancy::PGOcc): the
  # occupancy unit, whose visits are its replicates ...
  unit: [SITE_ID, YEAR]
  # ... the prior on the detection probability at the median day: normal on
  # the logit scale with mean logit(prior_p) and variance prior_var (0.24-0.94
  # for p as a 95 % interval), and the vague variance of every other
  # coefficient (spOccupancy's default), with which the model is refitted.
  prior_p: 0.7
  prior_var: 1
  prior_var_vague: 2.72
  # MCMC: samples per chain, burn-in, thinning, chains (1000 draws a chain).
  mcmc:
    samples: 15000
    burn: 5000
    thin: 10
    chains: 3
  # A fit whose largest Rhat exceeds max_rhat is run once more with chains
  # extend_factor times longer (the same number of draws).
  max_rhat: 1.1
  extend_factor: 4

#--------------------------------------------------#
# Synthesis of the key estimates -----
#--------------------------------------------------#

# Step 25 gathers the odds ratios of the management, protection and plant
# terms from the analyses of steps 17, 18 and 22-24 into one table per
# species (R/functions/synthesis.R). Step 26 lists the variables associated
# with each species and the main findings (R/functions/findings.R). Nothing
# is refitted.
synthesis:
  # The forest plot leaves out a fit whose upper CI limit is this many times
  # its lower one (a separated or barely estimable term); the tables keep it.
  max_interval_ratio: 10000
  # The sample each species' results are read from (REVISED_SAMPLES): all
  # imputed absences for P. nausithous; only the plausible ones for
  # P. teleius, most of whose imputed absences lie far from any population
  # known in 2012-2024 (P4.3; REVIEW.md, "What to report as what").
  primary_sample:
    nausithous: with_imputed
    teleius: plausible
  # A term is significant when its p is below this: the Wald p of the
  # model, or for a threat class the p adjusted within its family (Holm or
  # Benjamini-Hochberg, step 19).
  alpha: 0.05

#--------------------------------------------------#
# Habitat mapping and ecosystem layers -----
#--------------------------------------------------#

# The habitat mapping (VMB) and the ecosystem layer (KVES) of AOPK ČR, read
# by step 05 from local copies. R/tools/download_habitat_layers.R makes the
# copies: it downloads the kraj archives from data.nature.cz and keeps the
# features within `margin_m` of a site. It is run by hand; RETRIEVED.yml next
# to the copies says when and from where. Without the VMB copy, step 05 tries
# the AOPK network share, and the specifications using the current layers
# fall back to the frozen intersection of the original analysis
# (paths$habitat_legacy_intersection).
habitat:
  # The habitat input contract: one feature per habitat segment x mapped
  # habitat (a mosaic segment has several rows), as a GeoPackage in S-JTSK.
  layer: Data/Input/habitats/habitat_segments.gpkg
  crs_epsg: 5514
  # Columns the layer must have. SEGMENT_ID identifies the segment; BIOTOP is
  # the habitat code (X codes = non-natural) and STEJ_PR its share of the
  # segment, in per cent; BIOTOP_SEZ the mosaic composition; FSB the habitat
  # quality evaluation; HABITAT the Natura 2000 habitat code; REPRE and ZACH
  # the habitat's representativeness and conservation. HABITAT is not
  # published on data.nature.cz and is empty in the downloaded layer; a
  # crosswalk from BIOTOP will fill it. TODO(Jonáš): the crosswalk.
  required_columns: [SEGMENT_ID, BIOTOP, BIOTOP_SEZ, FSB, FSB_EVAL, HABITAT, STEJ_PR, REPRE, ZACH]
  # KVES, one local copy per version: one feature per ecosystem polygon
  # (KVES_ID, KATEGORIE, KOD), as a GeoPackage in S-JTSK. The versions before
  # 2025 publish only the category name; their KOD is the 2025 code of the
  # category of the same name, NA where 2025 has no such category.
  kves_layers:
    "2021": Data/Input/habitats/kves_2021.gpkg
    "2022": Data/Input/habitats/kves_2022.gpkg
    "2023": Data/Input/habitats/kves_2023.gpkg
    "2025": Data/Input/habitats/kves_2025.gpkg
  # The KVES version each record takes its KVES information from, by the
  # record's year: the closest version; on a tie (2024) the later one, which
  # includes the habitat mapping of that year. PROPOSED.
  kves_version_of_year: {"2019": "2021", "2020": "2021", "2021": "2021", "2022": "2022", "2023": "2023", "2024": "2025"}
  # Distance from a site (m). The local copies keep the features within it,
  # and a point or line site's KVES polygon is cut to it. Decided 2026-10-15.
  margin_m: 200
  # Optional loader for the AOPK network share (R/functions/habitat_layers.R,
  # load_vmb()).
  network_share: "//bali.nature.cz/du/Mapovani/Biotopy"
  # The download of the layers by R/tools/download_habitat_layers.R,
  # following the alcon-spatial project. Each is published as one zip per
  # kraj, clipped at the kraj boundary. The login is an ISOP login; the NDOP
  # account (NDOP_USER, NDOP_PWD in ~/.Renviron) is one. `archive` is a
  # sprintf pattern of the dataset URL and the kraj's file stem, `stem` which
  # of the kraj's two stems (below) the archive uses.
  download:
    login_url: https://login.nature.cz/login.php
    # ISOP application id of the data.nature.cz download portal.
    login_appid: "75"
    licence: CC BY 4.0, (c) AOPK ČR
    vmb:
      dataset: https://data.nature.cz/ds/21
      archive: "%s/download/kraj/%s.zip"
      stem: stem
      # The .cpg says "ANSI 1250", which GDAL does not recognise.
      encoding: CP1250
    kves:
      "2021":
        dataset: https://data.nature.cz/ds/101
        archive: "%s/download/kraj/KVES_%s.zip"
        stem: stem
        encoding: UTF-8
      "2022":
        dataset: https://data.nature.cz/ds/102
        archive: "%s/download/kraj/KVES_%s.zip"
        stem: stem
        encoding: CP1250
      "2023":
        dataset: https://data.nature.cz/ds/108
        archive: "%s/download/kraj/KVES_%s.zip"
        stem: stem
        encoding: CP1250
      "2025":
        dataset: https://data.nature.cz/ds/145
        archive: "%s/download/kraj/%s_KVES_2025.zip"
        stem: stem_kraj
        encoding: UTF-8
    # NUTS3 code of each kraj, and the two file stems its archives use.
    kraje:
      CZ010: {stem: Praha, stem_kraj: Praha}
      CZ020: {stem: Stredocesky, stem_kraj: StredoceskyKraj}
      CZ031: {stem: Jihocesky, stem_kraj: JihoceskyKraj}
      CZ032: {stem: Plzensky, stem_kraj: PlzenskyKraj}
      CZ041: {stem: Karlovarsky, stem_kraj: KarlovarskyKraj}
      CZ042: {stem: Ustecky, stem_kraj: UsteckyKraj}
      CZ051: {stem: Liberecky, stem_kraj: LibereckyKraj}
      CZ052: {stem: Kralovehradecky, stem_kraj: KralovehradeckyKraj}
      CZ053: {stem: Pardubicky, stem_kraj: PardubickyKraj}
      CZ063: {stem: Vysocina, stem_kraj: Vysocina}
      CZ064: {stem: Jihomoravsky, stem_kraj: JihomoravskyKraj}
      CZ071: {stem: Olomoucky, stem_kraj: OlomouckyKraj}
      CZ072: {stem: Zlinsky, stem_kraj: ZlinskyKraj}
      CZ080: {stem: Moravskoslezsky, stem_kraj: MoravskoslezskyKraj}
  # Point and line sites have no area of their own. With the current layers
  # each is described over the KVES polygon(s) it lies in, from the KVES
  # version of the record's year, cut to `margin_m` around the site (step 05,
  # site_areas()). A site outside KVES, and every site of the frozen
  # intersection, keeps its own geometry. Decided 2026-10-15.
  # Habitat codes of the meadows with Sanguisorba officinalis, summarised by
  # the area-weighted rule (SANGUISORBA_AREA, SANGUISORBA_SHARE). Decided
  # 2026-10-15.
  sanguisorba_meadow_codes: [T1.1, T1.4, T1.5, T1.7, T1.10]
  # Habitat codes of the wet meadows, summarised by the area-weighted rule
  # (WET_SHARE): a proxy for the habitat of the Myrmica host ants, which
  # limit both species (Anton et al. 2008) and prefer moist meadows (P4.6).
  # The alluvial, wet Cirsium, wet tall-herb, flooded and Molinia meadows
  # and the vegetation of wet disturbed soils; the literature review named
  # T1.5 and T1.10 as examples. PROPOSED. TODO(Jonáš): check the list.
  wet_meadow_codes: [T1.4, T1.5, T1.6, T1.7, T1.9, T1.10]
  # Width (m) of the edge zone of a polygon site (EDGE_SHARE, the share of
  # the site within it). The host ants are missing from the interior of
  # large, uniformly mown meadows (Oder 2026); the review proposed 20-30 m.
  # PROPOSED.
  edge_width_m: 25
  # Column holding a habitat's share of a mosaic segment, in per cent. The
  # area-weighted rule multiplies each overlap with the current layer by it,
  # so that a mosaic segment's area is not counted once per habitat. In the
  # downloaded layer STEJ_PR is that share: it adds up to 100 in every
  # segment (RETRIEVED.yml). The frozen intersection has one row per Natura
  # habitat record instead, which no share describes, so it is never
  # weighted. Decided 2026-10-15.
  share_column: STEJ_PR

#--------------------------------------------------#
# Randomness and model diagnostics -----
#--------------------------------------------------#

# Every permutation test and every simulation starts from this seed, so a
# re-run gives the same p-values.
seed: 20251008

# Checks run on every fitted model (R/functions/model_helpers.R). A model is
# flagged, not dropped, when it trips one of them.
diagnostics:
  # Number of simulations for the DHARMa residual tests.
  dharma_simulations: 250
  # A fixed effect this large (on the logit scale), or a standard error this
  # large, means (quasi-)complete separation rather than an estimate.
  separation_abs_estimate: 10
  separation_std_error: 5
  # A random-intercept variance this large means the grouping factor
  # separates the response (e.g. one record per level).
  max_random_variance: 20

#--------------------------------------------------#
# File locations -----
#--------------------------------------------------#

paths:
  input: Data/Input
  processed: Data/Processed
  temp: Data/Temp
  # Downloads kept between runs of the tools (not tracked by git).
  cache: Data/Cache
  outputs: Outputs
  occurrence:
    nausithous: Data/Input/Phengaris_nausithous_2019_2024.csv
    teleius: Data/Input/Phengaris_teleius_2019_2024.csv
  # Folders holding the w03_nd_lokalizace_{b,p,l} site shapefiles.
  site_layers:
    nausithous: Data/Input/Phengaris_nausithous_2019_2024
    teleius: Data/Input/Phengaris_teleius_2019_2024
  # The earlier exports (2012-2018, every source) and their sites. They say
  # where each species was known before the monitoring analysed here: the
  # plausibility of an imputed absence (P4.3) and the persistence of the
  # populations (P4.8). No model is fitted on them.
  occurrence_history:
    nausithous: Data/Input/Phengaris_nausithous_2012_2018.csv
    teleius: Data/Input/Phengaris_teleius_2012_2018.csv
  site_layers_history:
    nausithous: Data/Input/Phengaris_nausithous_2012_2018
    teleius: Data/Input/Phengaris_teleius_2012_2018
  # Article 17 reporting range, 10 x 10 km ETRS grid cells.
  ranges:
    nausithous: Data/Input/Reporting_range/nausithous.shp
    teleius: Data/Input/Reporting_range/teleius.shp
  # Frozen site x habitat-segment intersection of the original analysis.
  habitat_legacy_intersection: Data/Input/habitats/legacy/data_lokal_vmb.csv
  # Local copies of the remote reference layers; see `reference` below.
  reference: Data/Input/reference

#--------------------------------------------------#
# Remote reference layers -----
#--------------------------------------------------#

# The cascade reads these only from the copies in paths$reference. They are
# fetched by R/tools/refresh_reference_layers.R, which is run by hand; the
# date of each copy is in Data/Input/reference/RETRIEVED.yml.
reference:
  wfs_endpoint: "https://gis.nature.cz/arcgis/services/Aplikace/Opendata/MapServer/WFSServer?"
  wfs_layers:
    evl: "Opendata:Evropsky_vyznamne_lokality"
    mzchu: "Opendata:Maloplosna_zvlaste_chranena_uzemi__MZCHU_"
    sitmap: "Opendata:Mapovaci_sit_-_deleni_1.radu"
  # Aggregation factor applied to the shaded relief before it is stored.
  relief_aggregate: 3
